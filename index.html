<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Self-Contained GBA</title><link rel="stylesheet" href="style.css"><script src="js/util.js"></script><script src="js/core.js"></script><script src="js/arm.js"></script><script src="js/thumb.js"></script><script src="js/mmu.js"></script><script src="js/io.js"></script><script src="js/audio.js"></script><script src="js/video.js"></script><script src="js/video/proxy.js"></script><script src="js/video/software.js"></script><script src="js/irq.js"></script><script src="js/keypad.js"></script><script src="js/sio.js"></script><script src="js/savedata.js"></script><script src="js/gpio.js"></script><script src="js/gba.js"></script><script src="resources/biosbin.js"></script></head><body><div class="app"><header><div></div><label for="romPicker" id="chooseTop" class="primary">Choose .GBA</label><input id="romPicker" class="file-picker" type="file" accept=".gba,application/octet-stream"></header><main><section class="player"><div class="screen-wrap"><canvas id="screen" width="240" height="160"></canvas><div id="perf"><div>FPS: <b id="perfFps">--</b></div><div>Speed: <b id="perfSpeed">--</b></div><div>CPU: <b id="perfFrame">--</b></div><div>Video: <b id="perfVideo">--</b></div></div><div id="status">Choose a GBA game to begin.</div></div><div class="touch-layout" id="touchLayout"><div class="dpad"><button data-key="UP" class="up">▲</button><button data-key="LEFT" class="left">◀</button><button data-key="RIGHT" class="right">▶</button><button data-key="DOWN" class="down">▼</button></div><div class="center-controls"><button data-key="SELECT">SELECT</button><button data-key="START">START</button></div><div class="ab"><button data-key="B" class="b">B</button><button data-key="A" class="a">A</button></div><div class="shoulders"><button data-key="L">L</button><button data-key="R">R</button></div><div class="speed-controls"><button id="fast" type="button">Fast</button><button id="slow" type="button">Slow</button></div></div><button id="toggleTouch" class="toggle-touch" type="button">Hide Controls</button><button id="exitGameFullscreen" class="exit-game-fullscreen" type="button">Exit Fullscreen</button><div class="actions"><button id="pause" disabled>Pause</button><button id="reset" disabled>Reset</button><button id="save" disabled>Download Save</button><button id="loadSave" disabled>Load Save</button><input id="savePicker" type="file" accept=".sav,application/octet-stream" hidden><button id="fullscreenPage">Fullscreen Page</button><button id="fullscreenGame">Fullscreen Game</button></div></section><aside><h2>Controls</h2><p><b>D-pad:</b> Arrow keys</p><p><b>A / B:</b> Z / X</p><p><b>L / R:</b> A / S</p><p><b>Start:</b> Enter</p><p><b>Select:</b> \</p><hr><p class="small">ROMs are selected with your device's file picker and are not uploaded by this page.</p><p class="small">Save data is kept in this browser's local storage when supported.</p></aside></main></div><script>let gba=null,currentRomName="";const $=id=>document.getElementById(id);function setStatus(x){$("status").textContent=x}gba=new GameBoyAdvance();gba.keypad.eatInput=true;gba.setLogger((l,e)=>{console.error(e);setStatus("Emulator error — check the browser console.");gba.pause()});gba.setCanvas($("screen"));gba.logLevel=gba.LOG_ERROR;gba.setBios(biosBin);setStatus("Ready. Choose a .GBA file.");$("romPicker").onchange=()=>{const f=$("romPicker").files[0];if(!f)return;currentRomName=f.name;setStatus("Loading "+f.name+"…");gba.loadRomFromFile(f,ok=>{if(!ok){setStatus("Could not load this GBA file.");return}$("pause").disabled=$("reset").disabled=$("save").disabled=$("loadSave").disabled=false;setStatus("Running: "+currentRomName);gba.runStable()})};$("pause").onclick=()=>{if(gba.paused){gba.runStable();$("pause").textContent="Pause";setStatus("Running: "+currentRomName)}else{gba.pause();$("pause").textContent="Resume";setStatus("Paused")}};$("reset").onclick=()=>{gba.pause();gba.reset();$("pause").textContent="Pause";if(currentRomName){gba.runStable();setStatus("Reset: "+currentRomName)}};$("save").onclick=()=>gba.downloadSavedata();$("loadSave").onclick=()=>$("savePicker").click();$("fast").onclick=()=>{if(gba){gba.throttle=Math.max(0,(gba.throttle||16)-4);setStatus("Speed: Fast")}};$("slow").onclick=()=>{if(gba){gba.throttle=Math.min(100,(gba.throttle||16)+4);setStatus("Speed: Slow")}};$("savePicker").onchange=()=>{const f=$("savePicker").files[0];if(f){gba.loadSavedataFromFile(f);setStatus("Save loaded.")}};function toggleFullscreen(el,cls){el.classList.add(cls);if(el.requestFullscreen){const p=el.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement){document.documentElement.classList.remove("page-fallback-fullscreen");document.querySelector(".screen-wrap").classList.remove("game-fallback-fullscreen");document.body.classList.remove("game-fallback-active");$("exitGameFullscreen").classList.remove("show")}});$("fullscreenPage").onclick=()=>{if(document.fullscreenElement||document.documentElement.classList.contains("page-fallback-fullscreen")){document.exitFullscreen?.();document.documentElement.classList.remove("page-fallback-fullscreen")}else{toggleFullscreen(document.documentElement,"page-fallback-fullscreen")}};$("fullscreenGame").onclick=(e)=>{e.preventDefault();const el=document.querySelector(".screen-wrap");const active=el.classList.contains("game-fallback-fullscreen");el.classList.toggle("game-fallback-fullscreen",!active);document.body.classList.toggle("game-fallback-active",!active);$("exitGameFullscreen").classList.toggle("show",!active);if(!active)window.scrollTo(0,0)};$("exitGameFullscreen").onclick=()=>{const el=document.querySelector(".screen-wrap");el.classList.remove("game-fallback-fullscreen");document.body.classList.remove("game-fallback-active");document.body.classList.remove("touch-hidden");$("toggleTouch").textContent="Hide Controls";$("exitGameFullscreen").classList.remove("show")};$("toggleTouch").onclick=()=>{const hidden=document.body.classList.toggle("touch-hidden");$("toggleTouch").textContent=hidden?"Show Controls":"Hide Controls"};const bits={A:0,B:1,SELECT:2,START:3,RIGHT:4,LEFT:5,UP:6,DOWN:7,R:8,L:9};function press(n){gba.keypad.currentDown&=~(1<<bits[n])}function release(n){gba.keypad.currentDown|=1<<bits[n]}document.querySelectorAll("[data-key]").forEach(b=>{const n=b.dataset.key;const d=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}press(n);b.classList.add("held")};const u=e=>{e.preventDefault();release(n);b.classList.remove("held");try{if(b.hasPointerCapture(e.pointerId))b.releasePointerCapture(e.pointerId)}catch(_){} };b.addEventListener("pointerdown",d);b.addEventListener("pointerup",u);b.addEventListener("pointercancel",u);b.addEventListener("lostpointercapture",()=>{release(n);b.classList.remove("held")})});document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-key]"))e.preventDefault()});if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});(function(){const f=$("perfFps"),sp=$("perfSpeed"),fr=$("perfFrame"),vd=$("perfVideo");let last=performance.now(),lastEmu=0;function tick(){const now=(window.performance&&performance.now)?performance.now():Date.now();const elapsed=now-last;if(elapsed>=500){const emu=gba?gba.debugFrames:0;const emuFrames=emu-lastEmu;const fps=emuFrames*1000/elapsed;const speed=fps/59.7275*100;const ft=gba?gba.debugFrameTime:0;const vt=gba?gba.debugVideoTime:0;f.textContent=fps.toFixed(1);sp.textContent=speed.toFixed(0)+"%";fr.textContent=ft?ft.toFixed(1)+" ms":"--";vd.textContent=vt?vt.toFixed(1)+" ms":"--";last=now;lastEmu=emu}requestAnimationFrame(tick)}requestAnimationFrame(tick)})();</script></body></html>

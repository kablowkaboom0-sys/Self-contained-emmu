<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Self-Contained GBA</title><link rel="stylesheet" href="style.css"><script src="js/util.js"></script><script src="js/core.js"></script><script src="js/arm.js"></script><script src="js/thumb.js"></script><script src="js/mmu.js"></script><script src="js/io.js"></script><script src="js/audio.js"></script><script src="js/video.js"></script><script src="js/video/proxy.js"></script><script src="js/video/software.js"></script><script src="js/irq.js"></script><script src="js/keypad.js"></script><script src="js/sio.js"></script><script src="js/savedata.js"></script><script src="js/gpio.js"></script><script src="js/gba.js"></script><script src="resources/biosbin.js"></script></head><body><div class="app"><header><div></div><label for="romPicker" id="chooseTop" class="primary">Choose .GBA</label><input id="romPicker" class="file-picker" type="file" accept=".gba,application/octet-stream"></header><main><section class="player"><div class="screen-wrap"><canvas id="screen" width="240" height="160"></canvas><div id="perf"><div>FPS: <b id="perfFps">--</b></div><div>Speed: <b id="perfSpeed">--</b></div><div>CPU: <b id="perfFrame">--</b></div><div>Video: <b id="perfVideo">--</b></div></div><div id="status">Choose a GBA game to begin.</div></div><div class="touch-layout" id="touchLayout"><div class="dpad"><button data-key="UP" class="up">▲</button><button data-key="LEFT" class="left">◀</button><button data-key="RIGHT" class="right">▶</button><button data-key="DOWN" class="down">▼</button></div><div class="center-controls"><button data-key="SELECT">SELECT</button><button data-key="START">START</button></div><div class="ab"><button data-key="B" class="b">B</button><button data-key="A" class="a">A</button></div><div class="shoulders"><button data-key="L">L</button><button data-key="R">R</button></div><div class="speed-controls"><button id="fast" type="button">Fast</button><button id="slow" type="button">Slow</button></div></div><button id="toggleTouch" class="toggle-touch" type="button">Hide Controls</button><button id="exitGameFullscreen" class="exit-game-fullscreen" type="button">Exit Fullscreen</button><button id="exitMobileGameFullscreen" class="exit-mobile-game-fullscreen" type="button">Exit Mobile Fullscreen</button><div class="actions"><button id="pause" disabled>Pause</button><button id="reset" disabled>Reset</button><button id="save" disabled>Download Save</button><button id="loadSave" disabled>Load Save</button><input id="savePicker" type="file" accept=".sav,application/octet-stream" hidden><button id="fullscreenPage">Fullscreen Page</button><button id="fullscreenGame">Fullscreen Game</button><button id="fullscreenGameMobile">Fullscreen Game (Mobile)</button></div></section><aside><h2>Controls</h2><p><b>D-pad:</b> Arrow keys</p><p><b>A / B:</b> Z / X</p><p><b>L / R:</b> A / S</p><p><b>Start:</b> Enter</p><p><b>Select:</b> \</p><hr><p class="small">ROMs are selected with your device's file picker and are not uploaded by this page.</p><p class="small">Save data is kept in this browser's local storage when supported.</p></aside></main></div><script>let gba=null,currentRomName="";const $=id=>document.getElementById(id);function setStatus(x){$("status").textContent=x}gba=new GameBoyAdvance();gba.keypad.eatInput=true;gba.setLogger((l,e)=>{console.error(e);setStatus("Emulator error — check the browser console.");gba.pause()});gba.setCanvas($("screen"));gba.logLevel=gba.LOG_ERROR;gba.setBios(biosBin);setStatus("Ready. Choose a .GBA file.");
function unlockAudio(){
 const ctx=gba&&gba.audio&&gba.audio.context;
 if(ctx&&ctx.state==="suspended"){
   const p=ctx.resume();
   if(p&&p.catch)p.catch(()=>{});
 }
}
["pointerdown","touchstart","keydown","click"].forEach(type=>{

});$("romPicker").onchange=()=>{const f=$("romPicker").files[0];if(!f)return;currentRomName=f.name;setStatus("Loading "+f.name+"…");gba.loadRomFromFile(f,ok=>{if(!ok){setStatus("Could not load this GBA file.");return}$("pause").disabled=$("reset").disabled=$("save").disabled=$("loadSave").disabled=false;setStatus("Running: "+currentRomName);gba.runStable()})};$("pause").onclick=()=>{if(gba.paused){gba.runStable();$("pause").textContent="Pause";setStatus("Running: "+currentRomName)}else{gba.pause();$("pause").textContent="Resume";setStatus("Paused")}};$("reset").onclick=()=>{gba.pause();gba.reset();$("pause").textContent="Pause";if(currentRomName){gba.runStable();setStatus("Reset: "+currentRomName)}};$("save").onclick=()=>gba.downloadSavedata();$("loadSave").onclick=()=>$("savePicker").click();function setEmuSpeed(ms,label){if(!gba)return;gba.throttle=Math.max(0,Math.min(60,ms));window.__emuThrottle=gba.throttle;setStatus(label+" ("+gba.throttle+"ms frame delay)")}
let speedHoldTimer=null;
let speedHoldMode=0;
let normalThrottle=16;
function beginSpeedHold(mode,e){
 if(e){e.preventDefault();e.stopPropagation();}
 if(!gba)return;
 speedHoldMode=mode;
 normalThrottle=gba.throttle||16;
 gba.throttle=mode===1?8:32;
 setStatus(mode===1?"Speed: 200%":"Speed: 50%");
}
function endSpeedHold(e){
 if(e){e.preventDefault();e.stopPropagation();}
 if(!gba)return;
 if(speedHoldMode!==0) gba.throttle=normalThrottle;
 speedHoldMode=0;
 clearInterval(speedHoldTimer);

}
function bindSpeedButton(id,mode){
 const b=$(id);
 b.addEventListener("pointerdown",e=>beginSpeedHold(mode,e),{passive:false});
 b.addEventListener("pointerup",endSpeedHold,{passive:false});
 b.addEventListener("pointercancel",endSpeedHold,{passive:false});
 b.addEventListener("pointerleave",e=>{if(e.buttons===0)endSpeedHold(e)},{passive:false});

bindSpeedButton("fast",1);
bindSpeedButton("slow",-1);
$("savePicker").onchange=()=>{const f=$("savePicker").files[0];if(f){gba.loadSavedataFromFile(f);setStatus("Save loaded.")}};function toggleFullscreen(el,cls){el.classList.add(cls);if(el.requestFullscreen){const p=el.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}document.addEventListener("fullscreenchange",()=>{const native=!!document.fullscreenElement;document.documentElement.classList.toggle("page-native-fullscreen",native);if(!native){document.documentElement.classList.remove("page-fallback-fullscreen");document.querySelector(".screen-wrap").classList.remove("game-fallback-fullscreen");document.body.classList.remove("game-fallback-active");$("exitGameFullscreen").classList.remove("show")}});$("fullscreenPage").onclick=()=>{if(document.fullscreenElement||document.documentElement.classList.contains("page-fallback-fullscreen")){document.exitFullscreen?.();document.documentElement.classList.remove("page-fallback-fullscreen")}else{toggleFullscreen(document.documentElement,"page-fallback-fullscreen")}};$("fullscreenGame").onclick=(e)=>{e.preventDefault();const el=document.querySelector(".screen-wrap");const active=el.classList.contains("game-fallback-fullscreen");el.classList.toggle("game-fallback-fullscreen",!active);document.body.classList.toggle("game-fallback-active",!active);document.documentElement.classList.toggle("nested-game-fullscreen",!active);$("exitGameFullscreen").classList.toggle("show",!active);if(!active)window.scrollTo(0,0)};function enterMobileGameFullscreen(){const player=document.querySelector(".player");document.body.classList.add("mobile-game-active");$("exitMobileGameFullscreen").classList.add("show");window.scrollTo(0,0);if(player&&player.requestFullscreen){const p=player.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}function exitMobileGameFullscreen(){document.body.classList.remove("mobile-game-active");$("exitMobileGameFullscreen").classList.remove("show");document.body.classList.remove("touch-hidden");$("toggleTouch").textContent="Hide Controls";if(document.fullscreenElement)document.exitFullscreen?.()}$("fullscreenGameMobile").onclick=(e)=>{e.preventDefault();e.stopPropagation();if(document.body.classList.contains("mobile-game-active"))exitMobileGameFullscreen();else enterMobileGameFullscreen()};$("exitMobileGameFullscreen").onclick=(e)=>{e.preventDefault();e.stopPropagation();exitMobileGameFullscreen()};$("exitGameFullscreen").onclick=()=>{const el=document.querySelector(".screen-wrap");el.classList.remove("game-fallback-fullscreen");document.body.classList.remove("game-fallback-active");document.documentElement.classList.remove("nested-game-fullscreen");document.body.classList.remove("touch-hidden");$("toggleTouch").textContent="Hide Controls";$("exitGameFullscreen").classList.remove("show")};$("toggleTouch").onclick=()=>{const hidden=document.body.classList.toggle("touch-hidden");$("toggleTouch").textContent=hidden?"Show Controls":"Hide Controls"};const bits={A:0,B:1,SELECT:2,START:3,RIGHT:4,LEFT:5,UP:6,DOWN:7,R:8,L:9};function press(n){gba.keypad.currentDown&=~(1<<bits[n])}function release(n){gba.keypad.currentDown|=1<<bits[n]}const activeInputs=new Map();
function keyPress(n){press(n)}
function keyRelease(n){release(n)}
document.querySelectorAll("[data-key]").forEach(btn=>{
 const key=btn.dataset.key;
 const down=e=>{
  if(e.cancelable)e.preventDefault();
  e.stopPropagation();
  const id=e.pointerId!=null?"p"+e.pointerId:"t"+(e.changedTouches?.[0]?.identifier??"0");
  activeInputs.set(id,{btn,key});
  keyPress(key);
  btn.classList.add("held");
  if(e.pointerId!=null){try{btn.setPointerCapture(e.pointerId)}catch(_){}}
 };
 const up=e=>{
  if(e.cancelable)e.preventDefault();
  e.stopPropagation();
  const id=e.pointerId!=null?"p"+e.pointerId:"t"+(e.changedTouches?.[0]?.identifier??"0");
  const item=activeInputs.get(id);
  if(item&&item.btn===btn){keyRelease(item.key);activeInputs.delete(id);btn.classList.remove("held")}
 };
 btn.addEventListener("pointerdown",down,{passive:false});
 btn.addEventListener("pointerup",up,{passive:false});
 btn.addEventListener("pointercancel",up,{passive:false});
 btn.addEventListener("touchstart",down,{passive:false});
 btn.addEventListener("touchend",up,{passive:false});
 btn.addEventListener("touchcancel",up,{passive:false});
});
document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-key]"))e.preventDefault()});if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});(function(){const f=$("perfFps"),sp=$("perfSpeed"),fr=$("perfFrame"),vd=$("perfVideo");let last=performance.now(),lastEmu=0;function tick(){const now=(window.performance&&performance.now)?performance.now():Date.now();const elapsed=now-last;if(elapsed>=500){const emu=gba?gba.debugFrames:0;const emuFrames=emu-lastEmu;const fps=emuFrames*1000/elapsed;const speed=fps/59.7275*100;const ft=gba?gba.debugFrameTime:0;const vt=gba?gba.debugVideoTime:0;f.textContent=fps.toFixed(1);sp.textContent=speed.toFixed(0)+"%";fr.textContent=ft?ft.toFixed(1)+" ms":"--";vd.textContent=vt?vt.toFixed(1)+" ms":"--";last=now;lastEmu=emu}requestAnimationFrame(tick)}requestAnimationFrame(tick)})();</script></body></html>
